<!-- Two clocks marble machine: embeddable fragment. One instance per page. -->
<div class="tcm iso" data-theme="dark">
<style>
.tcm.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.tcm.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.tcm .iso-svg{display:block;width:100%;height:auto;overflow:visible}
.tcm .iso-svg path,.tcm .iso-svg circle{vector-effect:non-scaling-stroke}
.tcm .iso-fill{fill:var(--anatomy-paper);stroke:none}
.tcm .iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.tcm .iso-shade,.tcm .iso-top{stroke:none}
.tcm .iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.tcm .iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.tcm .iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.tcm .iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.tcm .iso-top{fill:var(--anatomy-top)}
.tcm .iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.tcm .iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.tcm .iso-solid[data-seamless]>.iso-shade,.tcm .iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.tcm .iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.tcm .iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.tcm .iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.tcm .iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.tcm .iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.tcm .iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.tcm .iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.tcm .iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.tcm .iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.tcm .iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.tcm .iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.tcm .iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tcm .iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.tcm .iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tcm .iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.tcm .iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.tcm .iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.tcm .iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.tcm .iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.tcm .iso-line[data-dashed]{stroke-dasharray:3 3}
.tcm .iso-line[data-flow]{stroke-dasharray:2 6}
.tcm .iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.tcm .iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.tcm .iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.tcm .iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.tcm .iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.tcm .iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.tcm .iso-dots[data-tone="hi"] circle{opacity:.85}
.tcm .iso-dots[data-tone="mid"] circle{opacity:.45}
.tcm .iso-dots[data-tone="lo"] circle{opacity:.22}
.tcm .iso-dots[data-tone="faint"] circle{opacity:.12}
.tcm .iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.tcm .iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.tcm .iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.tcm .iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tcm .tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tcm .tb-shine{fill:var(--anatomy-top);stroke:none}
.tcm .tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tcm .tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tcm .tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tcm .tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tcm .tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes tcm-iso-flow{to{stroke-dashoffset:-32}}
@keyframes tcm-iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.tcm .iso-line[data-flow]{animation:tcm-iso-flow 1600ms linear infinite}
.tcm .iso-dots circle[data-pulse]{animation:tcm-iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.tcm .iso-figure{margin:32px 0 36px}
.tcm .iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.tcm .iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.tcm .iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.tcm .iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.tcm .iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.tcm .iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.tcm .iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.tcm .iso-plate .iso-svg{margin:0 auto}
.tcm .iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.tcm .iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.tcm .iso-key{display:inline-flex;align-items:center;gap:7px}
.tcm .iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.tcm .iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.tcm .iso-swatch[data-mark="raised"] path,.tcm .iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.tcm .iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.tcm .iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.tcm .iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.tcm .iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.tcm .iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.tcm .iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.tcm .iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.tcm .iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.tcm .iso-plate{padding:48px 12px 70px}
.tcm .iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.tcm .iso-line[data-flow],.tcm .iso-dots circle[data-pulse]{animation:none}}
.tcm.iso{--anatomy-page:#08090B;--anatomy-card:#0C0E11;--anatomy-paper:#0C0E11;--anatomy-lit:#22CFFF;}
.tcm .tcm-glass .tcm-pane{fill:var(--anatomy-hi);fill-opacity:.035;stroke:none}
.tcm .tcm-void{fill:var(--anatomy-halo);stroke:none}
.tcm .tcm-pincap{fill:var(--anatomy-dot);opacity:.7;stroke:none}
.tcm .tcm-glint-dot{fill:var(--anatomy-hi);opacity:.85;stroke:none}
.tcm .tcm-marble,.tcm .tcm-ball{--anatomy-paper:#16191e;--anatomy-shade-0:#16191e;--anatomy-shade-1:#1d2026;--anatomy-shade-2:#262a31;--anatomy-shade-3:#30353d}
.tcm .tcm-stage{position:relative;outline:none;touch-action:pan-y;cursor:ew-resize}
.tcm .tcm-stage:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:6px}
.tcm .tcm-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:560px){.tcm .tcm-stage{overflow:hidden;margin:0 -12px}
.tcm .tcm-stage .iso-svg{width:118%;margin:-2% -9% -4%}}
.tcm{background:transparent;color:var(--anatomy-text)}
.tcm .iso-plate-corner{font-family:var(--anatomy-mono)}
</style>

  let run = [];
  const flush = () => {
    const tones = [...new Set(run.flatMap((level) => [...level.groups.keys()]))].sort((x, y) => x - y);
    for (const tone of tones) {
      const countOf = (level) => (level.groups.get(tone) ?? []).length;
      let start = 0;
      for (let at = 1; at <= run.length; at++) {
        if (at < run.length && countOf(run[at - 1]) === countOf(run[at])) continue;
        if (at - 1 > start && countOf(run[start])) sheet(tone, run.slice(start, at));
        if (at < run.length) strip(tone, run[at - 1], run[at]);
        start = at;
      }
    }
    run = [];
  };
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    if (Math.abs(ds) < 1e-9) {
      flush();
      continue;
    }
    const count = Math.max(1, rows);
    const reach = (Math.hypot(ds, meridian[i + 1][1] - meridian[i][1]) * k) / count;
    const limit = Math.max(1, Math.min(deepest, Math.ceil(Math.log2(Math.max(2, reach / fineness)))));
    const coarse = Array.from({ length: count + 1 }, (_, index) => levelOf(i, index / count));
    run.push(coarse[0]);
    const refine = (a, b, depth) => {
      const mid = levelOf(i, (a.u + b.u) / 2);
      const split = depth < limit && (!same(a, b) || !same(a, mid) || (depth < 6 && strayOf(i, a, mid, b) > error));
      if (!split) {
        run.push(b);
        return;
      }
      refine(a, mid, depth + 1);
      refine(mid, b, depth + 1);
    };
    for (let index = 1; index <= count; index++) refine(coarse[index - 1], coarse[index], 0);
  }
  flush();
  return buckets;
}

function sideOf(meridian) {
  const m = meridian.length;
  let first = 0;
  let last = m - 1;
  if (meridian[0][1] <= 1e-9) first = 1;
  if (meridian[m - 1][1] <= 1e-9) last = m - 2;
  const side = meridian.slice(first, last + 1);
  for (let index = 1; index < side.length; index++) if (side[index][0] - side[index - 1][0] <= 1e-9) return null;
  return side.length >= 3 ? side : null;
}

function surfaceOf(side, F, P, rims, { samples = 96, slope = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const facing = Math.atan2(dot3(F.v, V), dot3(F.u, V));
  const [left, right] = silhouettePoints(side, F, P, { samples, slope });
  if (left.length <= samples || right.length <= samples) return null;
  const s0 = side[0][0];
  const s1 = side[side.length - 1][0];
  const angleOf = (point) => angleToward(F, sub3(point, add3(F.o, mul3(F.a, dot3(sub3(point, F.o), F.a)))));
  const wrap = (angle) => ((angle % TAU) + TAU) % TAU;
  const arc = (s, r, from, to, through) => {
    let sweep = wrap(to - from);
    if (wrap(through - from) > sweep) sweep -= TAU;
    const count = Math.max(4, Math.ceil(Math.abs(sweep) / (TAU / 96)), Math.ceil((Math.abs(sweep) * r * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, index) => iso(pointOf(F, s, r, from + (sweep * index) / count), P));
  };
  const r0 = side[0][1];
  const r1 = side[side.length - 1][1];
  const bottom = -aV > 0 ? facing + Math.PI : facing;
  const top = aV > 0 ? facing + Math.PI : facing;
  const L = left.map((point) => iso(point, P));
  const R = right.map((point) => iso(point, P));
  const topArc = arc(s1, r1, angleOf(left[left.length - 1]), angleOf(right[right.length - 1]), top);
  const bottomArc = arc(s0, r0, angleOf(right[0]), angleOf(left[0]), bottom);
  const keepFirst = rims === "all" || rims === "first" || rims === "ends";
  const keepLast = rims === "all" || rims === "last" || rims === "ends";
  const fill = pathOf([...L, ...topArc, ...[...R].reverse(), ...bottomArc], true);
  const outline = [pathOf(L), pathOf(R), keepLast ? pathOf(topArc) : "", keepFirst ? pathOf(bottomArc) : ""].join("");
  const hull = hullOf([...arc(s0, r0, 0, TAU - 1e-6, Math.PI), ...arc(s1, r1, 0, TAU - 1e-6, Math.PI), ...L, ...R]);
  let gap = 0;
  for (const p of [...L, ...R]) {
    let best = Infinity;
    for (let index = 0; index < hull.length; index++) {
      const a = hull[index];
      const b = hull[(index + 1) % hull.length];
      const dx = b[0] - a[0];
      const dy = b[1] - a[1];
      const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy || 1)));
      best = Math.min(best, Math.hypot(p[0] - a[0] - dx * t, p[1] - a[1] - dy * t));
    }
    gap = Math.max(gap, best);
  }
  return { fill, outline, gap };
}

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const V = viewOf(P);
  const L = lightOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const aL = dot3(F.a, L);
  const uL = dot3(F.u, L);
  const vL = dot3(F.v, L);
  const n = steps;
  const m = meridian.length;
  const rings = meridian.map(([s, r]) => Array.from({ length: n }, (_, j) => iso(pointOf(F, s, r, (j / n) * TAU), P)));
  const midC = [];
  const midS = [];
  for (let j = 0; j < n; j++) {
    const t = ((j + 0.5) / n) * TAU;
    midC.push(Math.cos(t));
    midS.push(Math.sin(t));
  }
  const seen = [];
  const tones = [];
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    const length = Math.hypot(ds, dr);
    const row = [];
    const toneRow = [];
    for (let j = 0; j < n; j++) {
      if (length < 1e-9) {
        row.push(false);
        toneRow.push(0);
        continue;
      }
      const facing = ds * (midC[j] * uV + midS[j] * vV) - dr * aV;
      const lit = (ds * (midC[j] * uL + midS[j] * vL) - dr * aL) / length;
      row.push(facing > 1e-6 * length);
      toneRow.push(bandOf(lit));
    }
    seen.push(row);
    tones.push(toneRow);
  }
  const buckets = [[], [], [], [], []];
  const all = [];
  const smoothed = smooth ? smoothRows(meridian, F, P, { steps, ...(smooth === true ? {} : smooth) }) : null;
  if (smoothed) smoothed.forEach((list, tone) => list.forEach((d) => (buckets[tone].push(d), all.push(d))));
  for (let i = 0; i < m - 1; i++) {
    if (smoothed && Math.abs(meridian[i + 1][0] - meridian[i][0]) > 1e-9) continue;
    const keys = seen[i].map((visible, j) => (visible ? tones[i][j] : null));
    for (const { key, run } of groupsOf(keys)) {
      const a = run.map((j) => rings[i][j]);
      const b = run.map((j) => rings[i + 1][j]).reverse();
      const d = pathOf(oriented([...a, ...b]), true);
      buckets[key].push(d);
      all.push(d);
    }
  }
  const phi = Math.atan2(vV, uV);
  const flatV = Math.hypot(uV, vV);
  const rangeOf = (i) => {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    if (Math.hypot(ds, dr) < 1e-9) return null;
    if (Math.abs(ds) < 1e-9 || flatV < 1e-9) return -dr * aV > 1e-9 ? [-1, 1] : null;
    const c = (dr * aV) / (ds * flatV);
    return ds > 0 ? [Math.max(-1, c), 1] : [-1, Math.min(1, c)];
  };
  const arcsOf = (ranges) => {
    if (ranges.some((range) => !range)) return [];
    const lo = Math.max(...ranges.map(([x]) => x));
    const hi = Math.min(...ranges.map(([, x]) => x));
    if (lo >= hi - 1e-9) return [];
    const near = Math.acos(Math.min(1, hi));
    const far = Math.acos(Math.max(-1, lo));
    if (hi >= 1 && lo <= -1) return [[phi, phi + TAU]];
    if (hi >= 1) return [[phi - far, phi + far]];
    if (lo <= -1) return [[phi + near, phi + TAU - near]];
    return [[phi + near, phi + far], [phi - far, phi - near]];
  };
  const along = (s, r, [from, to]) => {
    const count = Math.max(2, Math.ceil(((to - from) * Math.max(r, 1e-6) * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, j) => iso(pointOf(F, s, r, from + ((to - from) * j) / count), P));
  };
  const creases = [];
  for (let i = 1; i < m - 1; i++) {
    if (meridian[i][2] || meridian[i][1] <= 1e-9) continue;
    for (const arc of arcsOf([rangeOf(i - 1), rangeOf(i)])) creases.push(pathOf(along(meridian[i][0], meridian[i][1], arc)));
  }
  let bevelPath = "";
  if (bevel > 0 && m > 2) {
    const ends = [];
    if (meridian[0][1] <= 1e-9) ends.push([0, 1, 1]);
    if (meridian[m - 1][1] <= 1e-9) ends.push([m - 2, m - 2, m - 3]);
    for (const [cap, rim, side] of ends) {
      const [s, r] = meridian[rim];
      for (const arc of arcsOf([rangeOf(cap), rangeOf(side)])) {
        const inset = along(s, Math.max(0, r - bevel), arc);
        const edge = along(s, r, arc);
        bevelPath += pathOf([edge[0], ...inset.slice(1, -1), edge[edge.length - 1]]);
      }
    }
  }
  const { fill: fillPath, outline } = outlineOf(meridian, F, P, { steps: n, fill, hole, rims, smooth, waist, all });
  return {
    fill: fillPath,
    outline,
    crease: creases.join(""),
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    bevel: bevelPath || undefined,
    seamless: Boolean(smoothed),
  };
}

function shapeOf(meridian, P, smooth) {
  if (smooth && smooth.radius) {
    const segments = meridian.slice(0, -1).map(([s0], index) => (Math.abs(meridian[index + 1][0] - s0) > 1e-9 ? { radius: smooth.radius, slope: smooth.slope } : null));
    return curved(meridian, P, segments);
  }
  const curves = smooth && !smooth.slope ? curveRuns(meridian) : null;
  return curves && curves.some(Boolean) ? curved(meridian, P, curves) : meridian;
}

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const n = steps;
  let fillPath;
  let outline;
  const shape = shapeOf(meridian, P, smooth);
  const side = fill === "auto" || fill === "surface" ? sideOf(shape) : null;
  const surface = side && !hole ? surfaceOf(side, F, P, rims, { slope: smooth && smooth.slope ? smooth.slope : null }) : null;
  if (surface && (fill === "surface" || surface.gap > waist)) {
    fillPath = surface.fill;
    outline = surface.outline;
  } else if (fill === "hull" || fill === "auto" || fill === "surface") {
    const most = Math.max(...shape.map(([, r]) => r));
    const around = Math.min(320, Math.max(n, Math.ceil((TAU * most * scaleOf(P)) / 1.5)));
    const tagged = [];
    shape.forEach(([s, r], index) => {
      for (let j = 0; j < around; j++) tagged.push({ p: iso(pointOf(F, s, r, (j / around) * TAU), P), ring: index });
    });
    const hull = hullTagged(tagged);
    const holePath = hole ? pathOf(Array.from({ length: around }, (_, j) => iso(pointOf(F, hole[0], hole[1], (j / around) * TAU), P)), true) : "";
    fillPath = pathOf(hull.map(({ p }) => p), true) + holePath;
    if (rims === "all") {
      outline = pathOf(hull.map(({ p }) => p), true) + holePath;
    } else {
      const keepFirst = rims === "first" || rims === "ends";
      const keepLast = rims === "last" || rims === "ends";
      const edges = hull.map((a, index) => {
        const b = hull[(index + 1) % hull.length];
        const same = a.ring === b.ring;
        const keep = !same || (a.ring !== 0 && a.ring !== shape.length - 1) || (keepFirst && a.ring === 0) || (keepLast && a.ring === shape.length - 1);
        return [a.p, b.p, keep];
      });
      outline = chains(edges).map((points) => pathOf(points)).join("") + holePath;
    }
  } else {
    fillPath = all ? all.join("") : (({ shades, top }) => [...shades, top].join(""))(lathe(meridian, F, P, { steps: n, fill: "auto", hole, rims, smooth, waist }));
    outline = "";
  }
  return { fill: fillPath, outline };
}

const signedArea = (points) => points.reduce((sum, [x, y], index) => {
  const [nx, ny] = points[(index + 1) % points.length];
  return sum + x * ny - nx * y;
}, 0);

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

function saddleOf(F, a, start, s1, P, { steps = stepsFor(a, 24) } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const n = steps;
  const angle = (j) => (j / n) * TAU;
  const from = typeof start === "function" ? start : (t) => saddleStart(start, a, t);
  const low = Array.from({ length: n }, (_, j) => iso(pointOf(F, from(angle(j)), a, angle(j)), P));
  const high = Array.from({ length: n }, (_, j) => iso(pointOf(F, s1, a, angle(j)), P));
  const seen = [];
  const tones = [];
  for (let j = 0; j < n; j++) {
    const normal = radialOf(F, angle(j + 0.5));
    seen.push(dot3(normal, V) > 1e-6);
    tones.push(bandOf(dot3(normal, L)));
  }
  const buckets = [[], [], [], [], []];
  const fills = [];
  const keys = seen.map((visible, j) => (visible ? tones[j] : null));
  for (const { key, run } of groupsOf(keys)) {
    const d = pathOf(oriented([...run.map((j) => low[j]), ...run.map((j) => high[j]).reverse()]), true);
    buckets[key].push(d);
    fills.push(d);
  }
  const capSeen = dot3(F.a, V) > 1e-6;
  if (capSeen) {
    const d = pathOf(oriented(high), true);
    buckets[bandOf(dot3(F.a, L))].push(d);
    fills.push(d);
  }
  const front = runsOf(seen);
  const back = runsOf(seen.map((visible) => !visible));
  const edges = [];
  for (const run of front) {
    edges.push(pathOf(run.map((j) => low[j])));
    edges.push(pathOf([low[run[0]], high[run[0]]]), pathOf([low[run[run.length - 1]], high[run[run.length - 1]]]));
  }
  for (const run of capSeen ? back : front) edges.push(pathOf(run.map((j) => high[j])));
  return {
    fill: fills.join(""),
    outline: edges.join(""),
    crease: capSeen ? front.map((run) => pathOf(run.map((j) => high[j]))).join("") : "",
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    seamless: true,
  };
}

function prismOf(F, polygon, s0, s1, P) {
  const V = viewOf(P);
  const L = lightOf(P);
  const ring = oriented(polygon.map(([x, y]) => [x, y]));
  const n = ring.length;
  const at = (s, [x, y]) => [F.o[0] + F.a[0] * s + F.u[0] * x + F.v[0] * y, F.o[1] + F.a[1] * s + F.u[1] * x + F.v[1] * y, F.o[2] + F.a[2] * s + F.u[2] * x + F.v[2] * y];
  const low = ring.map((point) => iso(at(s0, point), P));
  const high = ring.map((point) => iso(at(s1, point), P));
  const buckets = [[], [], [], [], []];
  const seen = [];
  for (let j = 0; j < n; j++) {
    const [x0, y0] = ring[j];
    const [x1, y1] = ring[(j + 1) % n];
    const normal = unit3(add3(mul3(F.u, y1 - y0), mul3(F.v, -(x1 - x0))));
    const visible = dot3(normal, V) > 1e-6;
    seen.push(visible);
    if (visible) buckets[bandOf(dot3(normal, L))].push(pathOf([low[j], low[(j + 1) % n], high[(j + 1) % n], high[j]], true));
  }
  const ends = [[s0, low, mul3(F.a, -1)], [s1, high, F.a]];
  const capSeen = ends.map(([, , normal]) => dot3(normal, V) > 1e-6);
  ends.forEach(([, points, normal], index) => capSeen[index] && buckets[bandOf(dot3(normal, L))].push(pathOf(points, true)));
  const hull = hullOf([...low, ...high]);
  const creases = [];
  for (let j = 0; j < n; j++) {
    const prev = (j - 1 + n) % n;
    const a = [ring[j][0] - ring[prev][0], ring[j][1] - ring[prev][1]];
    const b = [ring[(j + 1) % n][0] - ring[j][0], ring[(j + 1) % n][1] - ring[j][1]];
    const sharp = (a[0] * b[0] + a[1] * b[1]) / (Math.hypot(a[0], a[1]) * Math.hypot(b[0], b[1]) || 1) < Math.cos(0.35);
    if (sharp && seen[j] && seen[prev]) creases.push(pathOf([low[j], high[j]]));
    ends.forEach(([, points], index) => capSeen[index] && seen[j] && creases.push(pathOf([points[j], points[(j + 1) % n]])));
  }
  return { fill: pathOf(hull, true), outline: pathOf(hull, true), crease: creases.join(""), top: buckets[4].join(""), shades: buckets.slice(0, 4).map((list) => list.join("")) };
}

function stadium(r0, r1, offset, steps = 32) {
  const circle = (cx, r) => Array.from({ length: steps }, (_, index) => [cx + r * Math.cos((index / steps) * TAU), r * Math.sin((index / steps) * TAU)]);
  return hullOf([...circle(0, r0), ...circle(offset, r1)]);
}

function sphereOf(centre, r, P, { steps = 48 } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const F = frameAlong(centre, V);
  const flat = (p) => iso(p, P);
  const rim = Array.from({ length: steps }, (_, index) => pointOf(F, 0, r, (index / steps) * TAU));
  const outline = pathOf(rim.map(flat), true);
  const capOf = (threshold) => {
    const points = rim.filter((p) => dot3(sub3(p, centre), L) / r >= threshold).map(flat);
    const c = dot3(L, V);
    const LF = frameAlong(add3(centre, mul3(L, r * threshold)), L);
    const radius = r * Math.sqrt(Math.max(0, 1 - threshold * threshold));
    for (let index = 0; index < steps; index++) {
      const p = pointOf(LF, 0, radius, (index / steps) * TAU);
      if (dot3(sub3(p, centre), V) >= -1e-9) points.push(flat(p));
    }
    if (c > threshold) points.push(flat(add3(centre, mul3(V, r))));
    return points.length > 2 ? pathOf(hullOf(points), true) : "";
  };
  const shades = [outline, capOf(BANDS[1]), capOf(BANDS[2]), capOf(BANDS[3])];
  return { fill: outline, outline, crease: "", top: "", shades, seamless: true };
}

const disc = (s0, s1, r, F, P, options = {}) =>
  lathe(
    [
      [s0, 0],
      [s0, r],
      [s1, r],
      [s1, 0],
    ],
    F,
    P,
    { steps: stepsFor(r, 32, 160, scaleOf(P)), ...options },
  );

const ringBand = (s0, s1, rIn, rOut, F, P, options = {}) =>
  lathe(
    [
      [s0, rIn],
      [s0, rOut],
      [s1, rOut],
      [s1, rIn],
    ],
    F,
    P,
    { steps: stepsFor(rOut, 32, 160, scaleOf(P)), hole: null, ...options },
  );

function solidOf(profile, F, P, options = {}) {
  const first = profile[0];
  const last = profile[profile.length - 1];
  const meridian = [[first[0], 0], ...profile, [last[0], 0]];
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(meridian, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function bandOfProfile(profile, F, P, options = {}) {
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(profile, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function silhouettePoints(profile, F, P, { samples = 72, slope: given = null, radius = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const facing = Math.atan2(vV, uV);
  const flat = Math.hypot(uV, vV) || 1e-9;
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const radiusAt = radius ?? ((s) => {
    let index = 1;
    while (index < profile.length - 1 && profile[index][0] < s) index++;
    const [sa, ra] = profile[index - 1];
    const [sb, rb] = profile[index];
    return ra + ((rb - ra) * (s - sa)) / (sb - sa || 1);
  });
  const side = (sign) => {
    const points = [];
    for (let step = 0; step <= samples; step++) {
      const s = s0 + ((s1 - s0) * step) / samples;
      const h = (s1 - s0) / samples / 2 || 0.01;
      const slope = given ? given(s) : (radiusAt(Math.min(s1, s + h)) - radiusAt(Math.max(s0, s - h))) / (Math.min(s1, s + h) - Math.max(s0, s - h) || 1);
      const c = (slope * aV) / flat;
      if (Math.abs(c) > 1) continue;
      points.push(pointOf(F, s, radiusAt(s), facing + sign * Math.acos(c)));
    }
    return points;
  };
  return [side(1), side(-1)];
}

const silhouetteOf = (profile, F, P, options = {}) =>
  silhouettePoints(profile, F, P, options)
    .map((points) => pathOf(points.map((point) => iso(point, P))))

  const still = matchMedia("(prefers-reduced-motion: reduce)");
  const q = (sel) => svg.querySelector(sel);
  const live = {};
  for (const name of ["pendulum", "anchor", "wheel", "doing-hand", "think-hand", "sprocket-top", "sprocket-bottom", "lever", "needle", "bat", "pawl", "governor", "links"]) live[name] = q(`[data-live="${name}"]`);
  const links = [...live.links.querySelectorAll("circle")];
  const cups = [...svg.querySelectorAll("[data-cup]")];
  const cupMarbles = [...svg.querySelectorAll("[data-cupmarble]")];
  const pinPaths = [...svg.querySelectorAll("[data-pin]")];
  const pinCaps = [...svg.querySelectorAll("[data-pincap]")];
  const slots = {};
  svg.querySelectorAll("[data-slot]").forEach((g) => {
    const box = g.querySelector("[data-marbles]");
    if (box) box.textContent = "";
    slots[g.dataset.slot] = box;
  });
  const MARBLE = q("#tcm-marble").innerHTML;
  const NS = "http://www.w3.org/2000/svg";
  const nodes = new Map();

  // ---- controls
  const lever = { x: 2, target: 2 };
  const bot = { x: 0, target: 0 };
  let sim = MACH.warmed(2, 0, 2.6);
  let dragging = null;
  let touring = !still.matches;
  let tourClock = 0;
  let tourStep = 0;
  let idle = 0;
  const TOUR = [
    [2, 0, 9],
    [3, 0, 7],
    [3, 1, 8],
    [0, 0, 12],
  ];

  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const nearest = () => Math.round(clamp(lever.x, 0, 3));
  function textNow() {
    const robots = bot.x > 0.5;
    const s = MODEL.stateOf(MODEL.DETENTS[nearest()], robots);
    const b = MODEL.blendOf(lever.x, bot.x);
    const program = `program ${(1 / b.length).toFixed(1)}×`;
    return robots ? `${s.label} · doing ${s.doingRange} · ${program}` : `${s.label} · thinking ${s.thinkingRange} · ${program}`;
  }
  function describe() {
    const s = MODEL.stateOf(MODEL.DETENTS[Math.round(lever.target)], bot.target > 0.5);
    stage.setAttribute("aria-valuenow", String(Math.round(lever.target)));
    stage.setAttribute("aria-valuetext", `${MODEL.readoutOf(s)}, ${Math.round(s.shorter * 100)}% shorter than today`);
  }
  let announceTimer = 0;
  function announce() {
    clearTimeout(announceTimer);
    announceTimer = setTimeout(() => {
      if (status) status.textContent = textNow();
    }, 700);
  }

  // ---- drawing
  function render() {
    live.pendulum.setAttribute("transform", SC.pendulum(sim));
    live.anchor.setAttribute("transform", SC.anchor(sim));
    live.wheel.setAttribute("transform", SC.wheel(sim));
    live["doing-hand"].setAttribute("transform", SC.doingHand(sim));
    live["think-hand"].setAttribute("transform", SC.thinkHand(sim));
    live["sprocket-top"].setAttribute("transform", SC.sprocket(sim, "top"));
    live["sprocket-bottom"].setAttribute("transform", SC.sprocket(sim, "bottom"));
    live.lever.setAttribute("transform", SC.lever(lever.x));
    live.needle.setAttribute("transform", SC.needle(MODEL.blendOf(lever.x, bot.x).length));
    live.bat.setAttribute("transform", SC.bat(bot.x));
    live.pawl.setAttribute("transform", SC.pawl(bot.x));
    live.governor.innerHTML = SC.governorSvg(sim, solidSvg, lineSvg, dotsSvg);
    SC.linksOf(sim).forEach(([x, y], i) => {
      links[i].setAttribute("cx", x.toFixed(2));
      links[i].setAttribute("cy", y.toFixed(2));
    });
    SC.cupsOf(sim).forEach((c, i) => {
      cups[i].setAttribute("transform", c.move);
      if (c.loaded) {
        cupMarbles[i].removeAttribute("display");
        cupMarbles[i].setAttribute("transform", c.marble);
      } else cupMarbles[i].setAttribute("display", "none");
    });
    SC.pinsOf(sim).forEach((p, i) => {
      if (p.d) pinPaths[i].setAttribute("d", p.d);
      else pinPaths[i].removeAttribute("d");
      pinCaps[i].setAttribute("cx", p.cap[0].toFixed(2));
      pinCaps[i].setAttribute("cy", p.cap[1].toFixed(2));
      pinCaps[i].setAttribute("r", p.top ? "0.62" : "0");
    });
    const seen = new Set();
    const bySlot = {};
    for (const m of MACH.marblesOf(sim)) {
      seen.add(m.id);
      let node = nodes.get(m.id);
      if (!node) {
        node = document.createElementNS(NS, "g");
        node.setAttribute("data-marble", "");
        node.innerHTML = MARBLE;
        nodes.set(m.id, node);
      }
      node.setAttribute("transform", SC.shift(m.p));
      if ((m.alpha ?? 1) < 1) node.setAttribute("opacity", m.alpha.toFixed(2));
      else node.removeAttribute("opacity");
      node.__depth = G.dot3(m.p, V);
      (bySlot[m.slot] ??= []).push(node);
    }
    for (const [id, node] of nodes) if (!seen.has(id)) (node.remove(), nodes.delete(id));
    for (const [name, list] of Object.entries(bySlot)) {
      const box = slots[name];
      if (!box) continue;
      list.sort((a, b) => a.__depth - b.__depth);
      const children = box.children;
      let same = children.length === list.length;
      for (let i = 0; same && i < list.length; i++) same = children[i] === list[i];
      if (!same) {
        const frag = document.createDocumentFragment();
        list.forEach((node) => frag.appendChild(node));
        box.appendChild(frag);
      }
    }
    const text = textNow();
    if (readout && readout.textContent !== text) readout.textContent = text;
  }

  // ---- the loop
  let frame = 0;
  let last = 0;
  let visible = false;
  function tick(now) {
    const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
    last = now;
    if (touring) {
      tourClock += dt;
      if (tourClock > TOUR[tourStep][2]) {
        tourClock = 0;
        tourStep = (tourStep + 1) % TOUR.length;
        lever.target = TOUR[tourStep][0];
        bot.target = TOUR[tourStep][1];
        describe();
      }
    }
    const tau = dragging ? 0.08 : 0.32;
    lever.x += (lever.target - lever.x) * (1 - Math.exp(-dt / tau));
    if (Math.abs(lever.target - lever.x) < 1e-3) lever.x = lever.target;
    bot.x += (bot.target - bot.x) * (1 - Math.exp(-dt / 0.38));
    if (Math.abs(bot.target - bot.x) < 1e-3) bot.x = bot.target;
    MACH.stepSim(sim, dt, { u: lever.x, robots: bot.x });
    render();
    frame = visible ? requestAnimationFrame(tick) : 0;
  }
  const run = () => {
    if (still.matches) return;
    if (!frame && visible) {
      last = 0;
      frame = requestAnimationFrame(tick);
    }
  };
  function settleStill() {
    // reduced motion: jump to the chosen state and show one still frame of the machine there
    lever.x = lever.target;
    bot.x = bot.target;
    sim = MACH.warmed(lever.x, bot.x, 2.6);
    render();
  }
  function steer() {
    touring = false;
    clearTimeout(idle);
    idle = setTimeout(() => {
      if (still.matches) return;
      touring = true;
      tourClock = 0;
      tourStep = TOUR.findIndex(([u, r]) => u === Math.round(lever.target) && r === Math.round(bot.target));
      if (tourStep < 0) tourStep = 0;
      run();
    }, 3600);
    describe();
    announce();
    if (still.matches) settleStill();
    else run();
  }
  function setDetent(d) {
    lever.target = clamp(d, 0, 3);
    if (lever.target < 2.5 && bot.target > 0) bot.target = 0;
    steer();
  }
  function toggleRobots() {
    if (bot.target > 0.5) bot.target = 0;
    else {
      bot.target = 1;
      lever.target = 3;
    }
    steer();
  }

  new IntersectionObserver((entries) => {
    visible = entries[entries.length - 1].isIntersecting;
    if (visible) run();
  }, { rootMargin: "120px 0px" }).observe(stage);

  stage.addEventListener("keydown", (event) => {
    const key = event.key;
    let used = true;
    if (key >= "1" && key <= "4") setDetent(Number(key) - 1);
    else if (key === "r" || key === "R") toggleRobots();
    else if (key === "ArrowRight" || key === "ArrowUp") setDetent(Math.round(lever.target) + 1);
    else if (key === "ArrowLeft" || key === "ArrowDown") setDetent(Math.round(lever.target) - 1);
    else if (key === "Home") setDetent(0);
    else if (key === "End") setDetent(3);
    else used = false;
    if (used) event.preventDefault();
  });
  stage.addEventListener("pointerdown", (event) => {
    if (event.button !== 0) return;
    const box = svg.getBoundingClientRect();
    dragging = { x: event.clientX, u: lever.x, per: Math.max(36, box.width / 9) };
    try {
      stage.setPointerCapture(event.pointerId);
    } catch (error) {}
    steer();
  });
  stage.addEventListener("pointermove", (event) => {
    if (!dragging) return;
    lever.target = clamp(dragging.u + (event.clientX - dragging.x) / dragging.per, 0, 3);
    if (lever.target < 2.5 && bot.target > 0) bot.target = 0;
    steer();
  });
  const release = () => {
    if (!dragging) return;
    dragging = null;
    setDetent(Math.round(lever.target));
  };
  stage.addEventListener("pointerup", release);
  stage.addEventListener("pointercancel", release);
  stage.addEventListener("focus", () => status && (status.textContent = textNow()));
  still.addEventListener?.("change", () => {
    if (still.matches) {
      touring = false;
      settleStill();
    } else {
      touring = true;
      run();
    }
  });

  describe();
  render();
  if (still.matches) settleStill();
}

})();
</script>
</div>
